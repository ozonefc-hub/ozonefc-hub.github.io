<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OzoneFC — База знаний</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sidebar-bg: #444547;
      --sidebar-hover: #555759;
      --sidebar-active: #3a3c3e;
      --accent: #add145;
      --content-bg: #f5f7fa;
      --card-bg: #ffffff;
      --border: #e4e9f0;
      --text-dark: #1a202c;
      --text-mid: #4a5568;
      --text-muted: #8898aa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--content-bg);
      color: var(--text-dark);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 252px;
      min-width: 252px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 22px 20px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    .sidebar-logo {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-text { font-size: 0; }
    .logo-text span { font-size: 17px; font-weight: 700; }

    .sidebar-logo .logo-badge {
      background: var(--accent);
      color: #333;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .sidebar-subtitle {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
    }

    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 9px 20px;
      cursor: pointer;
      color: rgba(255,255,255,0.55);
      font-size: 13.5px;
      transition: background 0.12s, color 0.12s;
      border-left: 3px solid transparent;
      gap: 10px;
      user-select: none;
    }

    .nav-item:hover { background: var(--sidebar-hover); color: rgba(255,255,255,0.9); }
    .nav-item.active { background: var(--sidebar-active); color: #fff; border-left-color: var(--accent); }
    .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .bc-item {
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.1s;
    }
    .bc-item:hover { color: var(--accent); }
    .bc-item.current { color: var(--text-dark); font-weight: 500; cursor: default; }
    .bc-sep { color: var(--border); font-size: 16px; line-height: 1; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Welcome ── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      color: var(--text-muted);
      text-align: center;
    }
    .welcome-emoji { font-size: 52px; }
    .welcome-title { font-size: 18px; font-weight: 600; color: var(--text-mid); }
    .welcome-sub { font-size: 14px; }

    /* ── Section title ── */
    .section-title {
      font-size: 19px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── Cards grid ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 16px 14px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      user-select: none;
    }
    .card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(45,140,240,0.1);
      transform: translateY(-2px);
    }
    .card-emoji { font-size: 26px; margin-bottom: 2px; }
    .card-name { font-size: 13.5px; font-weight: 500; color: var(--text-dark); line-height: 1.3; }
    .card-hint { font-size: 12px; color: var(--text-muted); }

    /* ── File list ── */
    .file-list { display: flex; flex-direction: column; gap: 8px; }

    .file-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color 0.12s, background 0.12s;
      user-select: none;
    }
    .file-item:hover { border-color: var(--accent); background: #f0f6ff; }
    .file-emoji { font-size: 19px; width: 22px; text-align: center; flex-shrink: 0; }
    .file-name { flex: 1; font-size: 13.5px; color: var(--text-dark); }
    .file-arrow { color: var(--text-muted); font-size: 18px; }

    /* ── Empty ── */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }

    /* ── Loading ── */
    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 180px;
      gap: 10px;
      color: var(--text-muted);
      font-size: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      flex-shrink: 0;
    }

    /* ── Viewer ── */
    .viewer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .viewer-overlay.open { display: flex; }

    .viewer-modal {
      background: #fff;
      width: 92vw;
      height: 92vh;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .viewer-header {
      padding: 12px 16px 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    .viewer-title { font-size: 14px; font-weight: 500; color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .viewer-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .viewer-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 500; text-decoration: none;
      border: 1px solid var(--border); color: var(--text-mid);
      transition: background 0.1s;
    }
    .viewer-btn:hover { background: var(--content-bg); }
    .viewer-btn.primary { background: var(--accent); color: #333; border-color: var(--accent); }
    .viewer-btn.primary:hover { background: #c5e855; }

    .viewer-close {
      cursor: pointer; color: var(--text-muted);
      font-size: 24px; line-height: 1; padding: 2px 6px;
      border-radius: 4px; transition: background 0.1s;
    }
    .viewer-close:hover { background: var(--content-bg); color: var(--text-dark); }

    .viewer-iframe { flex: 1; border: none; width: 100%; }

    /* ── Error ── */
    .error-state {
      padding: 30px;
      background: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 8px;
      color: #c53030;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <span class="logo-text"><span style="color:#add145">o</span><span style="color:#fff">zone</span><span style="color:#add145">fc</span></span>
      <span class="logo-badge">DOCS</span>
    </div>
    <div class="sidebar-subtitle">База знаний</div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="loading-state"><div class="spinner"></div></div>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">
      <span class="bc-item current" data-action="home">Главная</span>
    </div>
  </div>
  <div class="content" id="content">
    <div class="welcome">
      <div class="welcome-emoji">📚</div>
      <div class="welcome-title">Добро пожаловать в базу знаний</div>
      <div class="welcome-sub">Выберите отдел в меню слева</div>
    </div>
  </div>
</div>


<script>
  const API_KEY   = 'AIzaSyA6irWYt1N2yIVTB8BB3Q4bw82VJ4xO47g';
  const ROOT_ID   = '1b6d1PRJSURJ6mHGim-XIgk-xyCuW_R8T';

  const DEPT_ICONS = {
    'Marketing': '📣', 'Commercial': '💼', 'HR': '👥',
    'Fitness': '🏋️', 'F&B': '🍽️', 'Finance': '💰',
    'CSO': '📋', 'Security & Facilities': '🔒'
  };

  const DOC_TYPE_ICONS = {
    'Велком бук': '👋', 'Должностная инструкция': '📋',
    'Регламенты': '📜', 'Стандарты': '⭐', 'Чек-листы': '✅'
  };

  // Cache & registry
  const cache    = {};
  const registry = {};

  async function driveList(folderId) {
    if (cache[folderId]) return cache[folderId];
    const url = `https://www.googleapis.com/drive/v3/files`
      + `?q=${encodeURIComponent(`'${folderId}' in parents and trashed=false`)}`
      + `&key=${API_KEY}&fields=files(id,name,mimeType)&orderBy=name&pageSize=200`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Drive API error: ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const files = data.files || [];
    cache[folderId] = files;
    files.forEach(f => registry[f.id] = f);
    return files;
  }

  function isFolderMime(mime) { return mime === 'application/vnd.google-apps.folder'; }

  function fileEmoji(mime) {
    if (mime.includes('document'))     return '📄';
    if (mime.includes('spreadsheet'))  return '📊';
    if (mime.includes('presentation')) return '📽️';
    if (mime.includes('pdf'))          return '📕';
    if (mime.includes('form'))         return '📝';
    return '📄';
  }

  function previewUrl(file) {
    const id = file.id, m = file.mimeType;
    if (m.includes('document'))     return `https://docs.google.com/document/d/${id}/preview`;
    if (m.includes('spreadsheet'))  return `https://docs.google.com/spreadsheets/d/${id}/preview`;
    if (m.includes('presentation')) return `https://docs.google.com/presentation/d/${id}/preview`;
    return `https://drive.google.com/file/d/${id}/preview`;
  }

  function driveUrl(file) {
    const id = file.id, m = file.mimeType;
    if (m.includes('document'))     return `https://docs.google.com/document/d/${id}/edit`;
    if (m.includes('spreadsheet'))  return `https://docs.google.com/spreadsheets/d/${id}/edit`;
    if (m.includes('presentation')) return `https://docs.google.com/presentation/d/${id}/edit`;
    return `https://drive.google.com/file/d/${id}/view`;
  }

  // Navigation state
  let nav = { dept: null, position: null, docType: null };

  // ── Render helpers ──────────────────────────────────────────────

  function setContent(html) {
    document.getElementById('content').innerHTML = html;
  }

  function setBreadcrumb(items) {
    const parts = [`<span class="bc-item" data-action="home">Главная</span>`];
    items.forEach((item, i) => {
      parts.push(`<span class="bc-sep">›</span>`);
      if (i === items.length - 1) {
        parts.push(`<span class="bc-item current">${item.label}</span>`);
      } else {
        parts.push(`<span class="bc-item" data-action="${item.action}">${item.label}</span>`);
      }
    });
    document.getElementById('breadcrumb').innerHTML = parts.join('');
  }

  function loadingContent() {
    setContent('<div class="loading-state"><div class="spinner"></div><span>Загрузка...</span></div>');
  }

  function errorContent(msg) {
    setContent(`<div class="error-state">⚠️ ${msg}</div>`);
  }

  function emptyContent(label) {
    setContent(`<div class="empty-state"><div class="empty-icon">📭</div>${label}</div>`);
  }

  // ── Views ───────────────────────────────────────────────────────

  function setHash(hash) {
    history.replaceState(null, '', hash ? '#' + hash : location.pathname);
  }

  async function showDepts() {
    nav = { dept: null, position: null, docType: null };
    setHash('');
    updateSidebarActive(null);
    setBreadcrumb([]);
    setContent(`<div class="welcome">
      <div class="welcome-emoji">📚</div>
      <div class="welcome-title">Добро пожаловать в базу знаний</div>
      <div class="welcome-sub">Выберите отдел в меню слева</div>
    </div>`);
  }

  async function showPositions(deptId) {
    nav.dept = deptId; nav.position = null; nav.docType = null;
    setHash(`dept:${deptId}`);
    const dept = registry[deptId];
    updateSidebarActive(deptId);
    setBreadcrumb([{ label: dept.name, action: `dept:${deptId}` }]);
    loadingContent();

    try {
      const items = await driveList(deptId);
      const positions = items.filter(f => isFolderMime(f.mimeType));
      if (!positions.length) { emptyContent('В этом отделе нет должностей'); return; }

      const cards = positions.map(p => `
        <div class="card" data-action="pos:${p.id}">
          <div class="card-emoji">👤</div>
          <div class="card-name">${p.name}</div>
          <div class="card-hint">Открыть →</div>
        </div>`).join('');

      setContent(`
        <div class="section-title">${DEPT_ICONS[dept.name] || '📁'} ${dept.name}</div>
        <div class="cards-grid">${cards}</div>`);
    } catch(e) { errorContent(e.message); }
  }

  async function showDocTypes(posId) {
    nav.position = posId; nav.docType = null;
    setHash(`dept:${nav.dept}/pos:${posId}`);
    const dept = registry[nav.dept];
    const pos  = registry[posId];
    setBreadcrumb([
      { label: dept.name, action: `dept:${nav.dept}` },
      { label: pos.name,  action: `pos:${posId}` }
    ]);
    loadingContent();

    try {
      const items = await driveList(posId);
      const types = items.filter(f => isFolderMime(f.mimeType));
      if (!types.length) { emptyContent('Нет разделов для этой должности'); return; }

      const cards = types.map(t => `
        <div class="card" data-action="type:${t.id}">
          <div class="card-emoji">${DOC_TYPE_ICONS[t.name] || '📁'}</div>
          <div class="card-name">${t.name}</div>
          <div class="card-hint">Открыть →</div>
        </div>`).join('');

      setContent(`
        <div class="section-title">👤 ${pos.name}</div>
        <div class="cards-grid">${cards}</div>`);
    } catch(e) { errorContent(e.message); }
  }

  async function showFiles(typeId) {
    nav.docType = typeId;
    setHash(`dept:${nav.dept}/pos:${nav.position}/type:${typeId}`);
    const dept = registry[nav.dept];
    const pos  = registry[nav.position];
    const type = registry[typeId];
    setBreadcrumb([
      { label: dept.name, action: `dept:${nav.dept}` },
      { label: pos.name,  action: `pos:${nav.position}` },
      { label: type.name, action: `type:${typeId}` }
    ]);
    loadingContent();

    try {
      const items = await driveList(typeId);
      const files = items.filter(f => !isFolderMime(f.mimeType));
      if (!files.length) {
        setContent(`
          <div class="section-title">${DOC_TYPE_ICONS[type.name] || '📁'} ${type.name}</div>
          <div class="empty-state"><div class="empty-icon">📭</div>Документы ещё не добавлены</div>`);
        return;
      }

      const list = files.map(f => `
        <div class="file-item" data-action="open:${f.id}">
          <span class="file-emoji">${fileEmoji(f.mimeType)}</span>
          <span class="file-name">${f.name}</span>
          <span class="file-arrow">›</span>
        </div>`).join('');

      setContent(`
        <div class="section-title">${DOC_TYPE_ICONS[type.name] || '📁'} ${type.name}</div>
        <div class="file-list">${list}</div>`);
    } catch(e) { errorContent(e.message); }
  }

  function openFile(fileId) {
    const file = registry[fileId];
    window.open(driveUrl(file), '_blank');
  }

  // ── Sidebar ─────────────────────────────────────────────────────

  function updateSidebarActive(deptId) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === deptId);
    });
  }

  async function loadSidebar() {
    const nav = document.getElementById('sidebarNav');
    try {
      const items = await driveList(ROOT_ID);
      const depts = items.filter(f => isFolderMime(f.mimeType));
      if (!depts.length) { nav.innerHTML = '<div style="padding:16px;color:rgba(255,255,255,.35);font-size:13px">Нет отделов</div>'; return; }

      nav.innerHTML = depts.map(d => `
        <div class="nav-item" data-action="dept:${d.id}" data-id="${d.id}">
          <span class="nav-icon">${DEPT_ICONS[d.name] || '📁'}</span>
          <span>${d.name}</span>
        </div>`).join('');
    } catch(e) {
      nav.innerHTML = `<div style="padding:16px;color:#fc8181;font-size:12px">Ошибка загрузки: ${e.message}</div>`;
    }
  }

  // ── Event delegation ─────────────────────────────────────────────

  function handleAction(action) {
    if (!action) return;
    if (action === 'home')              { showDepts(); return; }
    if (action.startsWith('dept:'))     { showPositions(action.slice(5)); return; }
    if (action.startsWith('pos:'))      { showDocTypes(action.slice(4)); return; }
    if (action.startsWith('type:'))     { showFiles(action.slice(5)); return; }
    if (action.startsWith('open:'))     { openFile(action.slice(5)); return; }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el) handleAction(el.dataset.action);
  });

  // ── Restore from URL hash ─────────────────────────────────────────
  async function restoreFromHash() {
    const hash = decodeURIComponent(window.location.hash.slice(1));
    if (!hash) return;
    const parts = hash.split('/');
    for (const part of parts) {
      if (part.startsWith('dept:')) {
        const id = part.slice(5);
        await driveList(id);
        nav.dept = id;
      } else if (part.startsWith('pos:')) {
        const id = part.slice(4);
        await driveList(id);
        nav.position = id;
      } else if (part.startsWith('type:')) {
        const id = part.slice(5);
        await driveList(id);
        nav.docType = id;
      }
    }
    if (nav.docType)       { await showFiles(nav.docType); }
    else if (nav.position) { await showDocTypes(nav.position); }
    else if (nav.dept)     { await showPositions(nav.dept); }
  }

  // ── Init ─────────────────────────────────────────────────────────
  async function init() {
    await loadSidebar();
    await restoreFromHash();
  }
  init();
</script>
</body>
</html>
