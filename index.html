<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OzoneFC — База знаний</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --sidebar-bg: #444547;
      --sidebar-hover: #555759;
      --sidebar-active: #3a3c3e;
      --accent: #add145;
      --content-bg: #f5f7fa;
      --card-bg: #ffffff;
      --border: #e4e9f0;
      --text-dark: #1a202c;
      --text-mid: #4a5568;
      --text-muted: #8898aa;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; background: var(--content-bg); color: var(--text-dark); }

    /* Sidebar */
    .sidebar { width: 252px; min-width: 252px; background: var(--sidebar-bg); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; }
    .sidebar-logo { font-size: 17px; font-weight: 700; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px; }
    .logo-text { font-size: 0; }
    .logo-text span { font-size: 17px; font-weight: 700; }
    .sidebar-logo .logo-badge { background: var(--accent); color: #333; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.5px; }
    .sidebar-subtitle { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 5px; letter-spacing: 0.8px; text-transform: uppercase; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .nav-item { display: flex; align-items: center; padding: 9px 20px; cursor: pointer; color: rgba(255,255,255,0.55); font-size: 13.5px; transition: background 0.12s, color 0.12s; border-left: 3px solid transparent; gap: 10px; user-select: none; }
    .nav-item:hover { background: var(--sidebar-hover); color: rgba(255,255,255,0.9); }
    .nav-item.active { background: var(--sidebar-active); color: #fff; border-left-color: var(--accent); }
    .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }

    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar { background: #fff; border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 13px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
    .bc-item { color: var(--text-muted); cursor: pointer; transition: color 0.1s; flex-shrink: 0; }
    .bc-item:hover { color: var(--accent); }
    .bc-item.current { color: var(--text-dark); font-weight: 500; cursor: default; overflow: hidden; text-overflow: ellipsis; }
    .bc-sep { color: var(--border); font-size: 16px; flex-shrink: 0; }

    /* Search */
    .search-wrap { position: relative; flex-shrink: 0; }
    .search-input { width: 220px; height: 34px; padding: 0 12px 0 34px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text-dark); background: var(--content-bg); outline: none; transition: border-color 0.15s, width 0.2s; }
    .search-input:focus { border-color: var(--accent); width: 280px; background: #fff; }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }
    .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 16px; display: none; }
    .search-clear.visible { display: block; }

    /* Content */
    .content { flex: 1; overflow-y: auto; padding: 28px; }
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 14px; color: var(--text-muted); text-align: center; }
    .welcome-emoji { font-size: 52px; }
    .welcome-title { font-size: 18px; font-weight: 600; color: var(--text-mid); }
    .welcome-sub { font-size: 14px; }

    .section-title { font-size: 19px; font-weight: 600; color: var(--text-dark); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

    /* Cards */
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px 16px 14px; cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s; display: flex; flex-direction: column; gap: 6px; user-select: none; }
    .card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(173,209,69,0.15); transform: translateY(-2px); }
    .card-emoji { font-size: 26px; margin-bottom: 2px; }
    .card-name { font-size: 13.5px; font-weight: 500; color: var(--text-dark); line-height: 1.3; }
    .card-hint { font-size: 12px; color: var(--text-muted); }

    /* File list */
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: border-color 0.12s, background 0.12s; user-select: none; }
    .file-item:hover { border-color: var(--accent); background: #f7fce8; }
    .file-emoji { font-size: 19px; width: 22px; text-align: center; flex-shrink: 0; }
    .file-name { flex: 1; font-size: 13.5px; color: var(--text-dark); }
    .file-arrow { color: var(--text-muted); font-size: 18px; }

    /* Search results */
    .search-results { display: flex; flex-direction: column; gap: 8px; }
    .search-result-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px; transition: border-color 0.12s, background 0.12s; }
    .search-result-item:hover { border-color: var(--accent); background: #f7fce8; }
    .search-result-info { flex: 1; min-width: 0; }
    .search-result-name { font-size: 13.5px; font-weight: 500; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-path { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-result-path span { color: var(--accent); font-weight: 500; }
    .search-loading { padding: 12px 0; color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }

    /* Empty / loading / error */
    .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .loading-state { display: flex; align-items: center; justify-content: center; height: 180px; gap: 10px; color: var(--text-muted); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.65s linear infinite; flex-shrink: 0; }
    .error-state { padding: 20px; background: #fff5f5; border: 1px solid #fed7d7; border-radius: 8px; color: #c53030; font-size: 13.5px; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <span class="logo-text"><span style="color:#add145">o</span><span style="color:#fff">zone</span><span style="color:#add145">fc</span></span>
      <span class="logo-badge">DOCS</span>
    </div>
    <div class="sidebar-subtitle">База знаний</div>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <div class="loading-state"><div class="spinner"></div></div>
  </nav>
</div>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">
      <span class="bc-item current" data-action="home">Главная</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="searchInput" type="text" placeholder="Поиск документов...">
      <span class="search-clear" id="searchClear">×</span>
    </div>
  </div>
  <div class="content" id="content">
    <div class="welcome">
      <div class="welcome-emoji">📚</div>
      <div class="welcome-title">Добро пожаловать в базу знаний</div>
      <div class="welcome-sub">Выберите отдел в меню слева</div>
    </div>
  </div>
</div>

<script>
  const API_KEY = 'AIzaSyA6irWYt1N2yIVTB8BB3Q4bw82VJ4xO47g';
  const ROOT_ID = '1b6d1PRJSURJ6mHGim-XIgk-xyCuW_R8T';

  const DEPT_ICONS = { 'Marketing':'📣','Commercial':'💼','HR':'👥','Fitness':'🏋️','F&B':'🍽️','Finance':'💰','CSO':'📋','Security & Facilities':'🔒' };
  const DOC_TYPE_ICONS = { 'Велком бук':'👋','Должностная инструкция':'📋','Регламенты':'📜','Стандарты':'⭐','Чек-листы':'✅' };

  const cache = {}, registry = {};
  let nav = { dept: null, position: null, docType: null };
  let allFiles = [], searchIndexed = false, searchIndexing = false;

  async function driveList(folderId) {
    if (cache[folderId]) return cache[folderId];
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent("'"+folderId+"' in parents and trashed=false")}&key=${API_KEY}&fields=files(id,name,mimeType)&orderBy=name&pageSize=200`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Ошибка Drive API: ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const files = data.files || [];
    cache[folderId] = files;
    files.forEach(f => registry[f.id] = f);
    return files;
  }

  function isFolder(mime) { return mime === 'application/vnd.google-apps.folder'; }

  function fileEmoji(mime) {
    if (mime.includes('document')) return '📄';
    if (mime.includes('spreadsheet')) return '📊';
    if (mime.includes('presentation')) return '📽️';
    if (mime.includes('pdf')) return '📕';
    if (mime.includes('form')) return '📝';
    return '📄';
  }

  function driveUrl(file) {
    const id = file.id, m = file.mimeType;
    if (m.includes('document')) return `https://docs.google.com/document/d/${id}/edit`;
    if (m.includes('spreadsheet')) return `https://docs.google.com/spreadsheets/d/${id}/edit`;
    if (m.includes('presentation')) return `https://docs.google.com/presentation/d/${id}/edit`;
    return `https://drive.google.com/file/d/${id}/view`;
  }

  // ── Render helpers ────────────────────────────────────────────────
  function setContent(html) { document.getElementById('content').innerHTML = html; }
  function loadingContent() { setContent('<div class="loading-state"><div class="spinner"></div><span>Загрузка...</span></div>'); }
  function errorContent(msg) { setContent(`<div class="error-state">⚠️ ${msg}</div>`); }

  function setBreadcrumb(items) {
    const parts = [`<span class="bc-item" data-action="home">Главная</span>`];
    items.forEach((item, i) => {
      parts.push(`<span class="bc-sep">›</span>`);
      parts.push(i === items.length-1
        ? `<span class="bc-item current">${item.label}</span>`
        : `<span class="bc-item" data-action="${item.action}">${item.label}</span>`);
    });
    document.getElementById('breadcrumb').innerHTML = parts.join('');
  }

  function setHash(hash) { history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search); }

  // ── Views ─────────────────────────────────────────────────────────
  async function showHome() {
    nav = { dept: null, position: null, docType: null };
    setHash('');
    updateSidebarActive(null);
    setBreadcrumb([]);
    setContent(`<div class="welcome"><div class="welcome-emoji">📚</div><div class="welcome-title">Добро пожаловать в базу знаний</div><div class="welcome-sub">Выберите отдел в меню слева</div></div>`);
  }

  async function showPositions(deptId) {
    nav.dept = deptId; nav.position = null; nav.docType = null;
    setHash('dept:' + deptId);
    const dept = registry[deptId];
    updateSidebarActive(deptId);
    setBreadcrumb([{ label: dept.name, action: 'dept:'+deptId }]);
    loadingContent();
    try {
      const items = await driveList(deptId);
      const positions = items.filter(f => isFolder(f.mimeType));
      if (!positions.length) { setContent('<div class="empty-state"><div class="empty-icon">📭</div>В этом отделе нет должностей</div>'); return; }
      const cards = positions.map(p => `<div class="card" data-action="pos:${p.id}"><div class="card-emoji">👤</div><div class="card-name">${p.name}</div><div class="card-hint">Открыть →</div></div>`).join('');
      setContent(`<div class="section-title">${DEPT_ICONS[dept.name]||'📁'} ${dept.name}</div><div class="cards-grid">${cards}</div>`);
    } catch(e) { errorContent(e.message); }
  }

  async function showDocTypes(posId) {
    nav.position = posId; nav.docType = null;
    setHash('dept:'+nav.dept+'/pos:'+posId);
    const dept = registry[nav.dept], pos = registry[posId];
    setBreadcrumb([{ label: dept.name, action:'dept:'+nav.dept }, { label: pos.name, action:'pos:'+posId }]);
    loadingContent();
    try {
      const items = await driveList(posId);
      const types = items.filter(f => isFolder(f.mimeType));
      if (!types.length) { setContent('<div class="empty-state"><div class="empty-icon">📭</div>Нет разделов для этой должности</div>'); return; }
      const cards = types.map(t => `<div class="card" data-action="type:${t.id}"><div class="card-emoji">${DOC_TYPE_ICONS[t.name]||'📁'}</div><div class="card-name">${t.name}</div><div class="card-hint">Открыть →</div></div>`).join('');
      setContent(`<div class="section-title">👤 ${pos.name}</div><div class="cards-grid">${cards}</div>`);
    } catch(e) { errorContent(e.message); }
  }

  async function showFiles(typeId) {
    nav.docType = typeId;
    setHash('dept:'+nav.dept+'/pos:'+nav.position+'/type:'+typeId);
    const dept = registry[nav.dept], pos = registry[nav.position], type = registry[typeId];
    setBreadcrumb([{ label: dept.name, action:'dept:'+nav.dept }, { label: pos.name, action:'pos:'+nav.position }, { label: type.name, action:'type:'+typeId }]);
    loadingContent();
    try {
      const items = await driveList(typeId);
      const files = items.filter(f => !isFolder(f.mimeType));
      if (!files.length) {
        setContent(`<div class="section-title">${DOC_TYPE_ICONS[type.name]||'📁'} ${type.name}</div><div class="empty-state"><div class="empty-icon">📭</div>Документы ещё не добавлены</div>`);
        return;
      }
      const list = files.map(f => `<div class="file-item" data-action="open:${f.id}"><span class="file-emoji">${fileEmoji(f.mimeType)}</span><span class="file-name">${f.name}</span><span class="file-arrow">›</span></div>`).join('');
      setContent(`<div class="section-title">${DOC_TYPE_ICONS[type.name]||'📁'} ${type.name}</div><div class="file-list">${list}</div>`);
    } catch(e) { errorContent(e.message); }
  }

  function openFile(fileId) {
    const file = registry[fileId];
    window.open(driveUrl(file), '_blank');
  }

  // ── Sidebar ───────────────────────────────────────────────────────
  function updateSidebarActive(deptId) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.id === deptId));
  }

  async function loadSidebar() {
    const navEl = document.getElementById('sidebarNav');
    try {
      const items = await driveList(ROOT_ID);
      const depts = items.filter(f => isFolder(f.mimeType));
      if (!depts.length) { navEl.innerHTML = '<div style="padding:16px;color:rgba(255,255,255,.35);font-size:13px">Нет отделов</div>'; return; }
      navEl.innerHTML = depts.map(d => `<div class="nav-item" data-action="dept:${d.id}" data-id="${d.id}"><span class="nav-icon">${DEPT_ICONS[d.name]||'📁'}</span><span>${d.name}</span></div>`).join('');
    } catch(e) {
      navEl.innerHTML = `<div style="padding:16px;color:#fc8181;font-size:12px">Ошибка: ${e.message}</div>`;
    }
  }

  // ── Search index ──────────────────────────────────────────────────
  async function buildSearchIndex() {
    if (searchIndexed || searchIndexing) return;
    searchIndexing = true;
    try {
      const depts = (await driveList(ROOT_ID)).filter(f => isFolder(f.mimeType));
      for (const dept of depts) {
        const positions = (await driveList(dept.id)).filter(f => isFolder(f.mimeType));
        for (const pos of positions) {
          const types = (await driveList(pos.id)).filter(f => isFolder(f.mimeType));
          for (const type of types) {
            const files = (await driveList(type.id)).filter(f => !isFolder(f.mimeType));
            for (const file of files) {
              allFiles.push({ ...file, path: `${dept.name} › ${pos.name} › ${type.name}`, deptName: dept.name, posName: pos.name, typeName: type.name, deptId: dept.id, posId: pos.id, typeId: type.id });
            }
          }
        }
      }
      searchIndexed = true;
    } catch(e) { /* silent */ }
    searchIndexing = false;
  }

  function doSearch(query) {
    const q = query.trim().toLowerCase();
    if (!q) { restoreView(); return; }
    const matches = allFiles.filter(f => f.name.toLowerCase().includes(q));
    const indexing = !searchIndexed;

    let html = `<div class="section-title">🔍 Результаты: «${query}»</div>`;
    if (indexing) html += `<div class="search-loading"><div class="spinner"></div> Индексирование...</div>`;
    if (!matches.length && searchIndexed) {
      html += '<div class="empty-state"><div class="empty-icon">🔎</div>Ничего не найдено</div>';
    } else if (matches.length) {
      html += '<div class="search-results">' + matches.map(f => `
        <div class="search-result-item" data-action="open:${f.id}">
          <span class="file-emoji">${fileEmoji(f.mimeType)}</span>
          <div class="search-result-info">
            <div class="search-result-name">${f.name}</div>
            <div class="search-result-path">${f.path}</div>
          </div>
          <span class="file-arrow">›</span>
        </div>`).join('') + '</div>';
    }
    setContent(html);
  }

  let searchTimer = null;
  let lastQuery = '';
  let savedView = null;

  function restoreView() {
    if (savedView) { setContent(savedView); savedView = null; }
    else showHome();
  }

  // ── Hash navigation ───────────────────────────────────────────────
  async function restoreFromHash() {
    const hash = decodeURIComponent(window.location.hash.slice(1));
    if (!hash) return;
    const parts = hash.split('/');
    for (const part of parts) {
      if (part.startsWith('dept:')) { const id = part.slice(5); await driveList(id); nav.dept = id; }
      else if (part.startsWith('pos:')) { const id = part.slice(4); await driveList(id); nav.position = id; }
      else if (part.startsWith('type:')) { const id = part.slice(5); await driveList(id); nav.docType = id; }
    }
    if (nav.docType) await showFiles(nav.docType);
    else if (nav.position) await showDocTypes(nav.position);
    else if (nav.dept) await showPositions(nav.dept);
  }

  // ── Event handling ────────────────────────────────────────────────
  function handleAction(action) {
    if (!action) return;
    if (action === 'home') { showHome(); return; }
    if (action.startsWith('dept:')) { showPositions(action.slice(5)); return; }
    if (action.startsWith('pos:')) { showDocTypes(action.slice(4)); return; }
    if (action.startsWith('type:')) { showFiles(action.slice(5)); return; }
    if (action.startsWith('open:')) { openFile(action.slice(5)); return; }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el) handleAction(el.dataset.action);
  });

  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  searchInput.addEventListener('input', () => {
    const q = searchInput.value;
    searchClear.classList.toggle('visible', q.length > 0);
    if (!q) { restoreView(); lastQuery = ''; return; }
    if (!savedView) savedView = document.getElementById('content').innerHTML;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      lastQuery = q;
      doSearch(q);
      if (!searchIndexed && !searchIndexing) {
        buildSearchIndex().then(() => { if (lastQuery) doSearch(lastQuery); });
      }
    }, 300);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    restoreView();
    lastQuery = '';
  });

  // ── Init ──────────────────────────────────────────────────────────
  async function init() {
    await loadSidebar();
    await restoreFromHash();
    setTimeout(buildSearchIndex, 2000);
  }
  init();
</script>
</body>
</html>
